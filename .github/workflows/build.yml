name: Build desktop apps
on:
  push:
    branches: [rust]
    tags: ["v2.*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag, such as v2.0.0-beta.3. Leave blank for a build only."
        required: false
        type: string
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb xdotool webkit2gtk-driver
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked -- --ignored
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
      - name: UI tests
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui
      - name: Build installers
        run: npm run desktop:build
      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        run: |
          app="src-tauri/target/release/bundle/macos/Clean Writer.app"
          archive="src-tauri/target/release/bundle/Clean-Writer-2.0.0-macOS-arm64-app.zip"
          test -d "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
      - name: Native close confirmation
        if: runner.os == 'Linux'
        run: dbus-run-session -- python3 tests/native_close.py --package "src-tauri/target/release/bundle/deb/Clean Writer_2.0.0_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: clean-writer-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v2.') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: desktop
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish downloadable installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          mkdir -p publish
          if [[ ! "$RELEASE_TAG" =~ ^v2\..+ ]]; then echo "Release tags must start with v2." >&2; exit 1; fi
          find release-assets -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.app.zip' \) -exec cp {} publish/ \;
          test -n "$(find publish -type f -print -quit)"
          for file in publish/*; do
            name="$(basename "$file" | tr ' ' '.')"
            if [[ "$name" != "$(basename "$file")" ]]; then mv "$file" "publish/$name"; fi
          done
          (cd publish && sha256sum * > SHA256SUMS.txt)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            args=()
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease --latest=false); fi
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Clean Writer $RELEASE_TAG (Rust)" --generate-notes "${args[@]}"
          fi
          gh release upload "$RELEASE_TAG" publish/* --clobber
